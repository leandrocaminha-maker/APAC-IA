<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Teste da Leia — AP Academia</title>
<style>
  :root {
    --fundo: #0f172a;
    --painel: #1e293b;
    --painel-2: #273449;
    --borda: #334155;
    --texto: #e2e8f0;
    --suave: #94a3b8;
    --acento: #22c55e;
    --acento-escuro: #16a34a;
    --alerta: #f59e0b;
    --erro: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--fundo);
    color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  input, textarea { font: inherit; }

  /* ── Login ───────────────────────────────── */
  #login {
    margin: auto;
    width: min(92vw, 360px);
    background: var(--painel);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
  }
  #login h1 { font-size: 20px; margin: 0 0 4px; }
  #login p { color: var(--suave); font-size: 14px; margin: 0 0 20px; }
  #login input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--borda);
    background: var(--fundo);
    color: var(--texto);
    margin-bottom: 12px;
  }
  #login button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: var(--acento);
    color: #06240f;
    font-weight: 700;
  }
  #login button:disabled { opacity: .6; cursor: wait; }

  /* ── App ─────────────────────────────────── */
  #app { display: none; flex: 1; flex-direction: column; min-height: 0; }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--painel);
    border-bottom: 1px solid var(--borda);
    flex-wrap: wrap;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--acento); color: #06240f;
    display: grid; place-items: center; font-weight: 700;
    flex-shrink: 0;
  }
  .titulo { font-weight: 600; line-height: 1.2; }
  .titulo small { display: block; color: var(--suave); font-weight: 400; font-size: 12px; }
  header .espaco { flex: 1; }
  header button {
    background: var(--painel-2);
    color: var(--texto);
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 13px;
  }
  header button:hover { border-color: var(--suave); }
  #nome {
    background: var(--fundo);
    border: 1px solid var(--borda);
    border-radius: 8px;
    color: var(--texto);
    padding: 7px 10px;
    font-size: 13px;
    width: 150px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: min(78ch, 82%);
    padding: 9px 13px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .leia { align-self: flex-start; background: var(--painel); border-bottom-left-radius: 4px; }
  .voce { align-self: flex-end; background: var(--acento-escuro); color: #f0fdf4; border-bottom-right-radius: 4px; }
  .sistema {
    align-self: center;
    background: transparent;
    border: 1px dashed var(--alerta);
    color: var(--alerta);
    font-size: 13px;
    text-align: center;
    max-width: 90%;
  }
  .erro { border-color: var(--erro); color: var(--erro); }
  .hora { display: block; font-size: 11px; opacity: .55; margin-top: 4px; }

  .digitando { display: flex; gap: 4px; align-items: center; }
  .digitando span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--suave);
    animation: pulso 1.2s infinite;
  }
  .digitando span:nth-child(2) { animation-delay: .2s; }
  .digitando span:nth-child(3) { animation-delay: .4s; }
  @keyframes pulso { 0%, 60%, 100% { opacity: .3 } 30% { opacity: 1 } }

  #sugestoes {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 8px 14px; border-top: 1px solid var(--borda);
  }
  #sugestoes button {
    background: var(--painel);
    border: 1px solid var(--borda);
    color: var(--suave);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    white-space: nowrap;
  }
  #sugestoes button:hover { color: var(--texto); border-color: var(--suave); }

  form {
    display: flex; gap: 8px; padding: 10px 14px 14px;
    background: var(--painel);
    border-top: 1px solid var(--borda);
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }
  #entrada {
    flex: 1;
    resize: none;
    max-height: 120px;
    padding: 11px 14px;
    border-radius: 20px;
    border: 1px solid var(--borda);
    background: var(--fundo);
    color: var(--texto);
  }
  #enviar {
    width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: var(--acento); color: #06240f; font-size: 18px; font-weight: 700;
    flex-shrink: 0;
  }
  #enviar:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="login">
  <h1>Teste da Leia</h1>
  <p>Consultora virtual da AP Academia — ambiente de teste</p>
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" autofocus>
  <button id="entrar">Entrar</button>
  <p id="loginErro" style="color:var(--erro);margin:12px 0 0;min-height:20px"></p>
</div>

<div id="app">
  <header>
    <div class="avatar">L</div>
    <div class="titulo">Leia <small>ambiente de teste — não é atendimento real</small></div>
    <div class="espaco"></div>
    <input id="nome" placeholder="Seu nome (opcional)" maxlength="60">
    <button id="reiniciar" title="Apaga o contexto e começa uma conversa nova">Nova conversa</button>
    <button id="sair">Sair</button>
  </header>

  <div id="chat"></div>

  <div id="sugestoes"></div>

  <form id="form">
    <textarea id="entrada" rows="1" placeholder="Escreva como um cliente escreveria…" maxlength="800"></textarea>
    <button id="enviar" type="submit" aria-label="Enviar">➤</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const chat = $('chat');

const SUGESTOES = [
  'Oi, quanto custa a natação?',
  'Meu filho tem 4 anos e nunca nadou',
  'Tá caro, na academia da esquina é 89',
  'Só posso treinar no sábado',
  'Quero cancelar meu plano',
  'Preciso de atestado médico?',
  'Quais as formas de pagamento?',
];

// ── API ────────────────────────────────────
async function api(rota, opcoes = {}) {
  const r = await fetch('/teste' + rota, {
    method: opcoes.corpo ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: opcoes.corpo ? JSON.stringify(opcoes.corpo) : undefined,
  });
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(dados.erro || 'Falha na comunicação com o servidor.');
  return dados;
}

// ── Render ─────────────────────────────────

// O agente escreve em formatação de WhatsApp: *negrito*, _itálico_.
// Escapamos o HTML antes de converter — o texto vem do modelo, não confiamos.
function formatar(texto) {
  const seguro = texto
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return seguro
    .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
    .replace(/_([^_\n]+)_/g, '<i>$1</i>');
}

function bolha(de, texto, hora) {
  const div = document.createElement('div');
  div.className = 'msg ' + de;
  div.innerHTML = formatar(texto);
  if (hora) {
    const h = document.createElement('span');
    h.className = 'hora';
    h.textContent = new Date(hora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    div.appendChild(h);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function aviso(texto, ehErro) {
  const div = document.createElement('div');
  div.className = 'msg sistema' + (ehErro ? ' erro' : '');
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function digitando() {
  const div = document.createElement('div');
  div.className = 'msg leia digitando';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function montarSugestoes() {
  const caixa = $('sugestoes');
  caixa.innerHTML = '';
  for (const s of SUGESTOES) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s;
    b.onclick = () => { $('entrada').value = s; $('form').requestSubmit(); };
    caixa.appendChild(b);
  }
}

// ── Fluxo ──────────────────────────────────
async function abrirChat() {
  $('login').style.display = 'none';
  $('app').style.display = 'flex';
  montarSugestoes();

  const sessao = await api('/sessao');
  $('nome').value = sessao.nome || '';
  chat.innerHTML = '';

  if (!sessao.mensagens.length) {
    aviso('Escreva como um cliente escreveria. Tudo aqui fica gravado para análise.');
  }
  for (const m of sessao.mensagens) bolha(m.de, m.texto, m.em);
}

async function enviar(texto) {
  bolha('voce', texto, new Date().toISOString());
  const espera = digitando();
  $('enviar').disabled = true;

  try {
    const r = await api('/mensagem', { corpo: { mensagem: texto } });
    espera.remove();
    bolha('leia', r.resposta, new Date().toISOString());
    if (r.handoff) {
      aviso('🤝 Aqui o bot transferiria para um consultor humano' +
            (r.motivo ? ' — motivo: ' + r.motivo : '') +
            '. No WhatsApp ele pararia de responder; aqui a conversa segue para você continuar testando.');
    }
  } catch (err) {
    espera.remove();
    aviso(err.message, true);
    if (/sess[ãa]o/i.test(err.message)) location.reload();
  } finally {
    $('enviar').disabled = false;
    $('entrada').focus();
  }
}

// ── Eventos ────────────────────────────────
$('entrar').onclick = async () => {
  const botao = $('entrar');
  botao.disabled = true;
  $('loginErro').textContent = '';
  try {
    await api('/entrar', { corpo: { senha: $('senha').value } });
    await abrirChat();
  } catch (err) {
    $('loginErro').textContent = err.message;
  } finally {
    botao.disabled = false;
  }
};

$('senha').onkeydown = (e) => { if (e.key === 'Enter') $('entrar').click(); };

$('form').onsubmit = (e) => {
  e.preventDefault();
  const texto = $('entrada').value.trim();
  if (!texto) return;
  $('entrada').value = '';
  $('entrada').style.height = 'auto';
  enviar(texto);
};

$('entrada').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
});

// Enter envia, Shift+Enter quebra linha — só no desktop: no celular o Enter
// do teclado virtual é quebra de linha e enviar no Enter atrapalha.
$('entrada').addEventListener('keydown', (e) => {
  const celular = window.matchMedia('(pointer: coarse)').matches;
  if (e.key === 'Enter' && !e.shiftKey && !celular) {
    e.preventDefault();
    $('form').requestSubmit();
  }
});

$('nome').onchange = () => api('/nome', { corpo: { nome: $('nome').value } }).catch(() => {});

$('reiniciar').onclick = async () => {
  if (!confirm('Começar uma conversa nova? A Leia esquece tudo o que foi dito até aqui.')) return;
  await api('/reiniciar', { corpo: {} });
  chat.innerHTML = '';
  aviso('Conversa nova. A Leia não lembra do que foi conversado antes.');
};

$('sair').onclick = async () => {
  await api('/sair', { corpo: {} });
  location.reload();
};

// Já tem sessão válida? Entra direto.
api('/sessao').then(abrirChat).catch(() => { $('senha').focus(); });
</script>
</body>
</html>
