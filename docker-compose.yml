services:
  # ─────────────────────────────────────
  # Evolution API (WhatsApp)
  # ─────────────────────────────────────
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      # URL pública da própria Evolution — ela usa isto para montar os links
      # de QR code e de mídia. Sem isso, esses links saem quebrados.
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_LOCAL_ENABLED=false
      - LOG_LEVEL=WARN
      # ── Webhook: é isto que faz a mensagem recebida chegar no backend ──
      # Global = vale para qualquer instância, inclusive as recriadas depois.
      # O host é o container_name do backend, resolvido dentro de apac-network.
      # O secret vai na query string porque o webhook global não suporta
      # headers customizados (o backend aceita ?secret= além do header).
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://apac-ia-sales:3100/webhook/evolution?secret=${WEBHOOK_SECRET}
      # PRECISA ser false: com true a Evolution acrescenta o nome do evento ao
      # final da URL (/webhook/evolution/messages-upsert) e cairia em 404.
      - WEBHOOK_GLOBAL_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
    networks:
      - apac-network

  # ─────────────────────────────────────
  # PostgreSQL (para Evolution API)
  # ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem `ports:` de propósito — este banco só é consumido pela Evolution
    # dentro de apac-network. Publicá-lo no host expõe credenciais
    # postgres/postgres na internet. Para depurar pontualmente:
    #   docker compose exec postgres psql -U postgres -d evolution
    networks:
      - apac-network

  # ─────────────────────────────────────
  # Redis (cache de sessões)
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    # Sem `ports:` de propósito — Redis sem senha publicado no host é
    # acesso irrestrito ao cache de sessões. Uso interno via apac-network.
    #   docker compose exec redis redis-cli
    volumes:
      - redis_data:/data
    networks:
      - apac-network

  # ─────────────────────────────────────
  # APAC-IA SALES (Backend Node.js)
  # ─────────────────────────────────────
  backend:
    build: .
    container_name: apac-ia-sales
    restart: unless-stopped
    ports:
      # Só no loopback: quem expõe este serviço à internet é o nginx da VPS,
      # em https://leia.apacademia.com.br. Publicar em 0.0.0.0 deixaria
      # /admin, /api e /teste acessíveis por IP em HTTP puro, ao lado do
      # caminho com TLS — e o /teste trafega conversa de cliente.
      - "127.0.0.1:${PORT:-3100}:3100"
    env_file:
      - .env
    environment:
      - EVOLUTION_API_URL=http://evolution-api:8080
      - NODE_ENV=production
    depends_on:
      - evolution
    networks:
      - apac-network

volumes:
  evolution_instances:
  postgres_data:
  redis_data:

networks:
  apac-network:
    driver: bridge
